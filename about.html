<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>关于我 · Rainly</title>
  <meta name="description" content="关于 Rainly —— 一个喜欢拍照、写代码、看动漫的旅行者">
  <meta name="theme-color" content="#fce4ec">
  <!-- Open Graph -->
  <meta property="og:title" content="关于我 · Rainly">
  <meta property="og:description" content="关于 Rainly —— 一个喜欢拍照、写代码、看动漫的旅行者">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://carterthyia.cloud/about.html">
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="关于我 · Rainly">
  <meta name="twitter:description" content="关于 Rainly —— 一个喜欢拍照、写代码、看动漫的旅行者">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@200;300;400&family=Klee+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/kawaii.css">
  <link rel="manifest" href="/manifest.json">
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <nav class="kawaii-nav">
    <a href="/" class="nav-brand">🌸 Rainly</a>
    <button class="hamburger" aria-label="菜单" onclick="this.nextElementSibling.classList.toggle('open')">☰</button>
    <div class="nav-links">
      <a href="/">首页</a>
      <a href="/gallery.html">画廊</a>
      <a href="/blog.html">博客</a>
      <a href="/about.html" class="active">关于</a>
    </div>
  </nav>

  <main class="about-container">
    <section class="about-card reveal">
      <img class="avatar" src="/images/uploads/12.JPG" alt="Rainly 的头像" id="profile-avatar" loading="lazy">
      <h3 id="profile-name">Rainly</h3>
      <div class="tags" id="profile-tags">
        <span>🌸 二次元</span><span>💻 程序员</span><span>✈️ 旅行</span>
      </div>
      <p class="bio" id="profile-bio">用脚步重新认识自己住的这个世界。<br>喜欢拍照、写代码、看动漫。</p>
      <div class="social-links">
        <a href="https://github.com/Rainly8023" target="_blank" rel="noopener noreferrer" class="kawaii-btn purple" style="padding:8px 20px;font-size:12px">🐙 GitHub</a>
        <a href="mailto:hi@carterthyia.cloud" class="kawaii-btn" style="padding:8px 20px;font-size:12px">💌 Email</a>
      </div>
    </section>
  </main>

  <footer class="kawaii-footer">
    <p>© 2026 Rainly · 用 💝 构建</p>
  </footer>

  <script type="module">
    import { initEffects } from './js/init.js';
    import { initScrollReveal } from './js/scroll-reveal.js';
    import { typeText } from './js/typewriter.js';

    initEffects();
    initScrollReveal();

    const bioEl = document.getElementById('profile-bio');
    const defaultBio = bioEl.innerHTML;
    bioEl.innerHTML = ''; // Clear immediately before typing starts

    // Load profile from CMS data (XSS-safe: using textContent)
    fetch('/content/settings/profile.json')
      .then(r => r.json())
      .then(data => {
        if (data.nickname) document.getElementById('profile-name').textContent = data.nickname;
        if (data.avatar) document.getElementById('profile-avatar').src = data.avatar;
        
        const finalBio = data.bio ? data.bio : defaultBio;
        typeText(bioEl, finalBio);
      })
      .catch(() => {
        typeText(bioEl, defaultBio);
      });
  </script>
</body>
</html>
