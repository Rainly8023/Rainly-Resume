<!DOCTYPE html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Rainly 的二次元小站 —— 美少女画廊 & 博客 & 3D 沉浸探索">
  <meta name="theme-color" content="#fce4ec">
  <!-- Open Graph -->
  <meta property="og:title" content="Rainly · 星空与樱花的入口">
  <meta property="og:description" content="Rainly 的二次元小站 —— 美少女画廊 & 博客 & 3D 沉浸探索">
  <meta property="og:type" content="website">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Rainly · 星空与樱花的入口">
  <meta name="twitter:description" content="Rainly 的二次元小站 —— 美少女画廊 & 博客 & 3D 沉浸探索">
  <meta name="twitter:image" content="https://images.unsplash.com/photo-1523712999610-f77fbcfc3843?w=1200&q=80">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@200;300;400;600&family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/kawaii.css">
  <link rel="manifest" href="/manifest.json">
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <nav class="kawaii-nav">
    <a href="/" class="nav-brand">🌸 Rainly</a>
    <div class="nav-links">
      <a href="/" class="active">首页</a>
      <a href="/gallery.html">画廊</a>
      <a href="/blog.html">博客</a>
      <a href="/about.html">关于</a>
    </div>
    <div class="nav-right">
      <button class="hamburger" aria-label="菜单" onclick="document.querySelector('.nav-links').classList.toggle('open')">☰</button>
    </div>
  </nav>

  <main class="hero">
    <div class="hero-avatar-wrap">
      <img src="/images/uploads/12.JPG" alt="Rainly" class="hero-avatar" onerror="this.src='https://images.unsplash.com/photo-1578632767115-351597cf2477?w=300&q=80'">
      <div class="hero-status-badge">
        <span class="status-dot"></span>
        <span>Online · 二次元幻想乡</span>
      </div>
    </div>

    <h1>Rainly</h1>
    <p class="subtitle">✦ 星と花の小世界 ✦</p>
    <p class="hero-tagline">用脚步重新认识住的这个世界。在星空与樱花交织的缝隙里，记录每一份温柔与浪漫。</p>

    <div class="hero-nav">
      <a href="/gallery.html" class="kawaii-btn">🌸 3D 美少女画廊</a>
      <a href="/blog.html" class="kawaii-btn purple">📖 碎碎念博客</a>
      <a href="/about.html" class="kawaii-btn">💝 关于 Rainly</a>
    </div>

    <!-- Daily Fortune & Anime Quote Card -->
    <div class="fortune-card" id="fortune-card" title="点击抽取今日少女箴言">
      <div class="fortune-header">
        <span>✨ 少女の今日箴言</span>
        <span id="fortune-level" style="background:var(--sakura-light);padding:2px 8px;border-radius:10px;font-size:11px">大吉 · 🌸 樱吹雪</span>
      </div>
      <div class="fortune-quote" id="fortune-quote">“生活明朗，万物可爱，人间值得，未来可期。”</div>
      <div class="fortune-tip">💡 点击卡片抽取新运势与动漫语录</div>
    </div>
  </main>

  <footer class="kawaii-footer">
    <p>© 2026 Rainly · 用 <a href="/admin" style="text-decoration: none; color: inherit;" title="管理后台">💝</a> 构建 · ✦ 愿所遇皆为美好 ✦</p>
  </footer>

  <script type="module">
    import { initEffects, showKawaiiToast } from './js/init.js';
    initEffects({ mouseTrail: true });

    // Anime Quotes & Fortunes List
    const quotes = [
      { text: "“隐约雷鸣，阴霾天空，但盼风雨来，能留你在此。” ——《言叶之庭》", level: "大吉 · 🌸 羁绊之恋" },
      { text: "“只要有想见的人，就不是孤身一人。” ——《夏目友人帐》", level: "超吉 · 🍃 温柔拂面" },
      { text: "“不管前方的路有多苦，只要走的方向正确，都比站在原地更接近幸福。” ——《千与千寻》", level: "大吉 · ⭐ 勇往直前" },
      { text: "“我一直在寻找着什么，陷入这种情绪，大概是从那天开始的。” ——《你的名字》", level: "中吉 · 🌌 命运之线" },
      { text: "“即使一个人，也可以走很远的路；如果两个人，风景会更加温柔。” ——《CLANNAD》", level: "大吉 · 💖 暖意融融" },
      { text: "“如果奇迹有颜色，那一定是初音未来色。” ——《VOCALOID》", level: "极运 · 🎵 音律奇迹" },
      { text: "“花开不是为了凋谢，而是为了绽放生命中最灿烂的温柔。”", level: "大吉 · 🌸 繁花似锦" },
      { text: "“在这个充满无限可能的星球上，每一次相遇都是奇迹。”", level: "超吉 · ✨ 满天星光" }
    ];

    const fortuneCard = document.getElementById('fortune-card');
    const quoteEl = document.getElementById('fortune-quote');
    const levelEl = document.getElementById('fortune-level');

    fortuneCard.addEventListener('click', () => {
      fortuneCard.style.transform = 'scale(0.95)';
      setTimeout(() => {
        const rand = quotes[Math.floor(Math.random() * quotes.length)];
        quoteEl.textContent = rand.text;
        levelEl.textContent = rand.level;
        fortuneCard.style.transform = 'scale(1.02)';
        showKawaiiToast('抽取了新的今日箴言 ✨', '🥠');
        setTimeout(() => { fortuneCard.style.transform = ''; }, 200);
      }, 150);
    });
  </script>
</body>
</html>
