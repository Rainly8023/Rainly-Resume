<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rainly Micro CMS</title>
  <link rel="stylesheet" href="../css/kawaii.css">
  <style>
    body { padding: 40px; }
    .cms-container { max-width: 800px; margin: 0 auto; background: var(--card-bg); padding: 30px; border-radius: 20px; box-shadow: var(--shadow-card); }
    .input-group { margin-bottom: 20px; }
    .input-group label { display: block; font-weight: bold; margin-bottom: 5px; color: var(--text); }
    .input-group input, .input-group textarea { width: 100%; padding: 10px; border: 2px solid #fce4ec; border-radius: 10px; font-family: inherit; }
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 30px; }
    .gallery-item { background: #fff; padding: 10px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; }
    .gallery-item img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; }
    #dashboard { display: none; }
    .delete-btn { background: #ff5252 !important; margin-top: 10px; }
    .loading { opacity: 0.5; pointer-events: none; }
  </style>
</head>
<body>
  <div class="cms-container">
    <div id="login-section">
      <h2 style="margin-bottom:20px; color:var(--sakura-pink);">🌸 Rainly CMS 登录</h2>
      <p style="margin-bottom: 20px; font-size: 14px;">请输入您的 GitHub Personal Access Token (PAT) 以管理画廊。</p>
      <div class="input-group">
        <label>GitHub Token</label>
        <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxxxxxxx">
      </div>
      <button class="kawaii-btn" id="login-btn">登录</button>
    </div>

    <div id="dashboard">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom:20px;">
        <h2 style="color:var(--sakura-pink);">🌸 画廊管理</h2>
        <button class="kawaii-btn" id="logout-btn" style="background:#b0bec5;">退出</button>
      </div>

      <div style="background: #fafafa; padding: 20px; border-radius: 15px; border: 2px dashed #fce4ec; margin-bottom: 30px;">
        <h3>➕ 添加新照片</h3>
        <div class="input-group" style="margin-top:15px;">
          <label>选择图片文件 (JPG/PNG)</label>
          <input type="file" id="new-img-file" accept="image/jpeg, image/png">
        </div>
        <div class="input-group">
          <label>标题</label>
          <input type="text" id="new-title" placeholder="如：樱花下">
        </div>
        <div class="input-group">
          <label>描述</label>
          <input type="text" id="new-desc" placeholder="一句话描述...">
        </div>
        <button class="kawaii-btn" id="upload-btn">上传并发布</button>
        <p id="upload-status" style="margin-top:10px; color: var(--text-light); font-size: 12px;"></p>
      </div>

      <h3>📸 已有照片</h3>
      <div class="gallery-grid" id="gallery-list"></div>
    </div>
  </div>

  <script src="./cms.js" type="module"></script>
</body>
</html>
