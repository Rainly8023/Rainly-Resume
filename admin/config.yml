# ── Decap CMS 配置 ──
# 文档: https://decapcms.org/docs/configuration-options/

backend:
  name: github
  repo: Rainly8023/Rainly-Resume
  branch: main

# 站点域名（OAuth 回调用）
site_url: https://carterthyia.cloud

# 媒体文件
media_folder: images/uploads
public_folder: /images/uploads

# 内容语言
locale: zh_Hans

# ═══════════ 内容集合 ═══════════

collections:
  # ── 旅行日记 ──
  - name: travel
    label: "旅行日记"
    label_singular: "旅行记录"
    folder: content/travel
    create: true
    slug: "{{year}}-{{month}}-{{slug}}"
    preview_path: "travel/{{slug}}"
    editor:
      preview: false
    fields:
      - label: "标题"
        name: title
        widget: string
        hint: "旅行地点的名字，如「吉隆坡 · 热带风情」"
      - label: "日期"
        name: date
        widget: datetime
        format: "MMM YYYY"
        date_format: "MM/YYYY"
        time_format: false
      - label: "国家/地区"
        name: country
        widget: string
        hint: "如 Malaysia, Singapore, Hong Kong"
      - label: "封面图片 URL"
        name: image
        widget: string
        hint: "Unsplash 图片链接或其他图片 URL"
      - label: "简短描述"
        name: description
        widget: text
        hint: "显示在卡片下方的一小段描述"
      - label: "正文"
        name: body
        widget: markdown
        required: false
        hint: "可选的详细游记（Markdown 格式）"

  # ── 博客文章 ──
  - name: posts
    label: "博客文章"
    label_singular: "文章"
    folder: content/posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    editor:
      preview: false
    fields:
      - label: "标题"
        name: title
        widget: string
      - label: "发布日期"
        name: date
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: "HH:mm"
      - label: "封面图"
        name: image
        widget: image
        required: false
      - label: "标签"
        name: tags
        widget: list
        required: false
      - label: "摘要"
        name: summary
        widget: text
        required: false
      - label: "正文"
        name: body
        widget: markdown

  # ── 页面管理（独立文件） ──
  - name: settings
    label: "网站设置"
    editor:
      preview: false
    files:
      - label: "个人信息"
        name: profile
        file: content/settings/profile.json
        fields:
          - label: "昵称"
            name: nickname
            widget: string
            default: "Rainly"
          - label: "个人简介"
            name: bio
            widget: text
            default: "用脚步重新认识自己住的这个世界。"
          - label: "社交媒体链接"
            name: social
            widget: object
            fields:
              - {label: "GitHub", name: github, widget: string, required: false}
              - {label: "Twitter", name: twitter, widget: string, required: false}
              - {label: "邮箱", name: email, widget: string, required: false}
